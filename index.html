<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR-мітки: сканування</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#st{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(#000a,#0000);font-size:.95rem;pointer-events:none}
#go{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);padding:14px 26px;border:0;border-radius:999px;background:#fff;color:#111;font:inherit;font-weight:600;box-shadow:0 4px 16px #0006}
#cam{display:none}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="view"></canvas>
<div id="st">Натисніть «Почати», дозвольте камеру та наведіть її на фото з міткою.</div>
<button id="go">Почати</button>

<script>
//DECODER-START
var N=28,IDBITS=19,R_IN=56,SPAN=36,L_SHORT=.30,L_LONG=.75,PROC_W=640;
function crc8(v){var d=[(v>>16)&255,(v>>8)&255,v&255],c=0;for(var i=0;i<3;i++){c^=d[i];for(var k=0;k<8;k++)c=(c&128)?(((c<<1)^7)&255):((c<<1)&255);}return c;}
function hsvOf(r,g,b){var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d>0){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return [h,mx?d/mx:0,mx/255];}
function isNavy(r,g,b){var mx=Math.max(r,g,b),v=mx/255;if(v<.08||v>.67)return false;var mn=Math.min(r,g,b),d=mx-mn;if(d/mx<.35)return false;var h=hsvOf(r,g,b)[0];return h>=200&&h<=270;}
function isYel(r,g,b){var mx=Math.max(r,g,b),v=mx/255;if(v<.43)return false;var mn=Math.min(r,g,b),d=mx-mn;if(d/mx<.31)return false;var h=hsvOf(r,g,b)[0];return h>=30&&h<=76;}

// 1) диск: темно-синя пляма → заповнена форма → еліпс за моментами
function findDisc(px,w,h){
  var n=w*h,mask=new Uint8Array(n),i;
  for(i=0;i<n;i++)mask[i]=isNavy(px[4*i],px[4*i+1],px[4*i+2])?1:0;
  var lab=new Int32Array(n),comps=[],stack=new Int32Array(n),nl=0;
  for(i=0;i<n;i++){if(!mask[i]||lab[i])continue;nl++;var sp=0,area=0,x0=w,x1=0,y0=h,y1=0;stack[sp++]=i;lab[i]=nl;
    while(sp){var p=stack[--sp],x=p%w,y=(p/w)|0;area++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&mask[p-1]&&!lab[p-1]){lab[p-1]=nl;stack[sp++]=p-1;}if(x<w-1&&mask[p+1]&&!lab[p+1]){lab[p+1]=nl;stack[sp++]=p+1;}
      if(y>0&&mask[p-w]&&!lab[p-w]){lab[p-w]=nl;stack[sp++]=p-w;}if(y<h-1&&mask[p+w]&&!lab[p+w]){lab[p+w]=nl;stack[sp++]=p+w;}}
    if(area>150)comps.push({id:nl,area:area,x0:x0,x1:x1,y0:y0,y1:y1});}
  comps.sort(function(a,b){return b.area-a.area;});
  for(var q=0;q<Math.min(4,comps.length);q++){var c=comps[q],S=0,Sx=0,Sy=0,Sxx=0,Sxy=0,Syy=0;
    for(var y=c.y0;y<=c.y1;y++){var a=-1,b=-1;for(var x=c.x0;x<=c.x1;x++)if(lab[y*w+x]===c.id){if(a<0)a=x;b=x;}
      if(a<0)continue;var k=b-a+1,sx=(a+b)*k/2,sxx=(b*(b+1)*(2*b+1)-(a-1)*a*(2*a-1))/6;S+=k;Sx+=sx;Sy+=y*k;Sxx+=sxx;Sxy+=y*sx;Syy+=y*y*k;}
    var mx=Sx/S,my=Sy/S,cxx=Sxx/S-mx*mx,cxy=Sxy/S-mx*my,cyy=Syy/S-my*my,
        th=.5*Math.atan2(2*cxy,cxx-cyy),tr=cxx+cyy,df=Math.sqrt(Math.max(0,(cxx-cyy)*(cxx-cyy)/4+cxy*cxy)),l1=tr/2+df,l2=tr/2-df;
    if(l2<=0)continue;var A=2*Math.sqrt(l1),B=2*Math.sqrt(l2);
    if(S/(Math.PI*A*B)<.88||S/(Math.PI*A*B)>1.12||B/A<.45||A<7)continue;
    return {cx:mx,cy:my,a:A,b:B,e1:[Math.cos(th),Math.sin(th)]};}
  return null;}

// 2) випрямлення і зчитування кільця; повертає {id,T} де T — матриця маркер→екран
function readMarker(px,w,h,PH,WH,HH){
  var E=findDisc(px,w,h);if(!E)return null;
  var kk=WH/w;E={cx:E.cx*kk,cy:E.cy*kk,a:E.a*kk,b:E.b*kk,e1:E.e1};px=PH;w=WH;h=HH;window.lastDiam=Math.round(E.a+E.b);
  var e1=E.e1,e2=[-e1[1],e1[0]],Y=new Float32Array(160000),u,v;
  for(v=0;v<400;v++)for(u=0;u<400;u++){var rx=(u-200)/200,ry=(v-200)/200;if(rx*rx+ry*ry>1.04)continue;
    var X=Math.round(E.cx+rx*E.a*e1[0]+ry*E.b*e2[0]),Z=Math.round(E.cy+rx*E.a*e1[1]+ry*E.b*e2[1]);if(X<0||Z<0||X>=w||Z>=h)continue;
    var p=4*(Z*w+X);Y[v*400+u]=isYel(px[p],px[p+1],px[p+2])?1:0;}
  var B=new Float32Array(160000);for(v=1;v<399;v++)for(u=1;u<399;u++){var s=0;for(var dv=-1;dv<=1;dv++)for(var du=-1;du<=1;du++)s+=Y[(v+dv)*400+u+du];B[v*400+u]=s/9;}
  var M=360,cs=[],sn=[],cN=[],sN=[],j;for(j=0;j<M;j++){var f=2*Math.PI*j/M;cs.push(Math.cos(f));sn.push(Math.sin(f));cN.push(Math.cos(N*f));sN.push(Math.sin(N*f));}
  function at(x,y){x=Math.round(x);y=Math.round(y);return B[Math.min(399,Math.max(0,y))*400+Math.min(399,Math.max(0,x))];}
  function prof(cx,cy){var ya=new Float32Array(M),r0=2*(R_IN+3);for(j=0;j<M;j++){var s=0;for(var d=-3;d<=3;d++)s+=at(cx+(r0+d)*cs[j],cy+(r0+d)*sn[j]);ya[j]=s/7;}return ya;}
  function coh(cx,cy){var ya=prof(cx,cy),re=0,im=0,t=0;for(j=0;j<M;j++){re+=ya[j]*cN[j];im+=ya[j]*sN[j];t+=ya[j];}return Math.sqrt(re*re+im*im)/Math.max(t,1e-6);}
  var cx=200,cy=200;[[10,2],[2.5,.5]].forEach(function(g){var best=[-1,cx,cy];for(var dx=-g[0];dx<=g[0]+1e-6;dx+=g[1])for(var dy=-g[0];dy<=g[0]+1e-6;dy+=g[1]){var c=coh(cx+dx,cy+dy);if(c>best[0])best=[c,cx+dx,cy+dy];}cx=best[1];cy=best[2];});
  var ya=prof(cx,cy),re=0,im=0;for(j=0;j<M;j++){re+=ya[j]*cN[j];im-=ya[j]*sN[j];}
  var phase=-Math.atan2(im,re)/N,lens=[],k;
  for(k=0;k<N;k++){var phi=phase+2*Math.PI*k/N,last=R_IN,gap=0;
    for(var r=R_IN-2;r<98.5;r+=.7){var s2=0;[-.03,0,.03].forEach(function(o){s2+=at(cx+2*r*Math.cos(phi+o),cy+2*r*Math.sin(phi+o));});
      if(s2/3>.4){last=r;gap=0;}else{gap+=.7;if(gap>3)break;}}
    lens.push((last-R_IN)/SPAN);}
  var si=0;for(k=1;k<N;k++)if(lens[k]>lens[si])si=k;if(lens[si]<.88)return null;
  var thr=(L_SHORT+L_LONG)/2,val=0,cr=0;
  for(k=1;k<=IDBITS;k++)val=val*2+(lens[(si+k)%N]>thr?1:0);
  for(k=IDBITS+1;k<N;k++)cr=cr*2+(lens[(si+k)%N]>thr?1:0);
  if(crc8(val)!==cr)return null;
  var D=phase+2*Math.PI*si/N+Math.PI/2,cD=Math.cos(D),sD=Math.sin(D); // поворот маркера
  // маркер (одиниці радіуса диска) → екран: E + A·((cx-200)/200,(cy-200)/200) + A·R(D)·m
  var A=[[E.a*e1[0],E.b*e2[0]],[E.a*e1[1],E.b*e2[1]]],ox=(cx-200)/200,oy=(cy-200)/200;
  var T=[A[0][0]*cD+A[0][1]*sD, -A[0][0]*sD+A[0][1]*cD, E.cx+A[0][0]*ox+A[0][1]*oy,
         A[1][0]*cD+A[1][1]*sD, -A[1][0]*sD+A[1][1]*cD, E.cy+A[1][0]*ox+A[1][1]*oy];
  return {id:val,T:T};}
//DECODER-END

var $=function(i){return document.getElementById(i);};
var cam=$('cam'),view=$('view'),vctx=view.getContext('2d'),work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
var table={},vids={},cur=null,seen=0,pose=null,candidate=null,busy=false;
function status(t){if(/debug/.test(location.search)&&window.stats)t+='  [мітка ≈'+(window.lastDiam||0)+' px, читань '+stats.hits+'/'+stats.tries+']';$('st').textContent=t;}
function mul(M,Nn){ // M·Nn для афінних 2×3 (як 3×3)
  return [M[0]*Nn[0]+M[1]*Nn[3],M[0]*Nn[1]+M[1]*Nn[4],M[0]*Nn[2]+M[1]*Nn[5]+M[2],M[3]*Nn[0]+M[4]*Nn[3],M[3]*Nn[1]+M[4]*Nn[4],M[3]*Nn[2]+M[4]*Nn[5]+M[5]];}
var hiCv=document.createElement('canvas'),hiCtx=hiCv.getContext('2d',{willReadFrequently:true}),stats={tries:0,hits:0},GRACE=2500,lastId=null,pausedAt=0;
function tick(){
  if(busy||cam.readyState<2){return;}busy=true;
  var vw=cam.videoWidth,vh=cam.videoHeight,sc=PROC_W/vw,HW=Math.min(1280,vw),sH=HW/vw;
  work.width=PROC_W;work.height=Math.round(vh*sc);wctx.drawImage(cam,0,0,work.width,work.height);
  hiCv.width=HW;hiCv.height=Math.round(vh*sH);hiCtx.drawImage(cam,0,0,hiCv.width,hiCv.height);
  var dl=wctx.getImageData(0,0,work.width,work.height),dh=hiCtx.getImageData(0,0,hiCv.width,hiCv.height),r=null;
  try{r=readMarker(dl.data,work.width,work.height,dh.data,hiCv.width,hiCv.height);}catch(e){}
  stats.tries++;
  if(r){stats.hits++;var ok=candidate&&candidate.id===r.id;candidate={id:r.id};
    if(ok||cur===r.id){var T=r.T.map(function(x){return x/sH;}); // у координати відеокадру
      if(pose&&cur===r.id)T=T.map(function(x,i){return .5*x+.5*pose[i];});
      pose=T;seen=performance.now();setCurrent(r.id);}}
  else candidate=null;
  window.stats=stats;busy=false;}
function setCurrent(id){if(cur===id)return;var resume=(id===lastId&&performance.now()-pausedAt<10000);cur=id;for(var k in vids)if(+k!==id)vids[k].pause();var v=vids[id];if(v){if(!resume)v.currentTime=0;v.play().catch(function(){v.muted=true;v.play();});}}
function frame(){
  if(cam.videoWidth){if(view.width!==cam.videoWidth){view.width=cam.videoWidth;view.height=cam.videoHeight;}vctx.drawImage(cam,0,0);
    var fresh=pose&&performance.now()-seen<GRACE,m=cur!==null?table[cur]:null,v=cur!==null?vids[cur]:null;
    if(fresh&&m&&v&&v.dataset.err)status('Не знайдено відеофайл «'+m.src+'». Перевірте, що він лежить поруч зі сторінкою і названий саме так.');
    else if(fresh&&m&&v&&v.readyState>=2){
      // відео (пікселі) → зображення → координати маркера → екран
      var vw=v.videoWidth,vh=v.videoHeight,pa=m.w/m.h,sw,sh,sx,sy; // «cover»: заповнюємо фото без спотворень, зайве обрізаємо
      if(vw/vh>pa){sh=vh;sw=vh*pa;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/pa;sx=0;sy=(vh-sh)/2;}
      var k=[m.w/sw/m.r,0,-m.cx/m.r,0,m.h/sh/m.r,-m.cy/m.r],F=mul(pose,k);
      vctx.save();vctx.transform(F[0],F[3],F[1],F[4],F[2],F[5]);vctx.drawImage(v,sx,sy,sw,sh,0,0,sw,sh);vctx.restore();
      status('Мітка №'+cur+' — відео відтворюється');}
    else if(fresh&&cur!==null&&!m)status('Мітку №'+cur+' прочитано, але для неї немає запису у videos.json');
    else if(fresh&&m)status('Мітка №'+cur+' — завантаження відео…');
    else{if(cur!==null){if(v)v.pause();lastId=cur;pausedAt=performance.now();cur=null;}status('Наведіть камеру на фото з міткою (усю мітку має бути видно).');}}
  requestAnimationFrame(frame);}
$('go').addEventListener('click',async function(){
  $('go').style.display='none';status('Завантаження…');
  try{table=await (await fetch('videos.json')).json();}catch(e){status('Не вдалося прочитати videos.json: '+e);return;}
  for(var id in table){var v=document.createElement('video');v.src=table[id].src;v.loop=true;v.playsInline=true;v.preload='auto';v.setAttribute('playsinline','');v.onerror=function(){this.dataset.err='1';};vids[id]=v;}
  for(var id2 in vids){var vv=vids[id2];try{vv.muted=false;await vv.play();vv.pause();vv.currentTime=0;}catch(e){vv.muted=true;}} // «розблокування» звуку жестом
  try{var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});cam.srcObject=s;await cam.play();}
  catch(e){status('Немає доступу до камери: '+e);return;}
  status('Наведіть камеру на фото з міткою.');setInterval(tick,110);requestAnimationFrame(frame);});
</script>
</body>
</html>
